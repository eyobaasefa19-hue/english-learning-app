<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ፈተና - የእንግሊዝኛ መማሪያ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>የእንግሊዝኛ ፈተና</h1>
    </header>

    <main class="content-container">
        <div id="quiz-box" class="card">
            <h2 id="question">ጥያቄ እዚህ ጋር ይመጣል...</h2>
            <div id="options" class="options-container"></div>
            <p id="feedback"></p>
        </div>

        <div id="score-box" class="card hidden">
            <h2>ፈተናውን ጨርሰዋል!</h2>
            <p id="score-text"></p>
            <button onclick="restartQuiz()" class="btn">እንደገና ጀምር</button>
        </div>

        <br>
        <a href="index.html" class="btn-back">← ወደ ዋና ገጽ ተመለስ</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
