<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ፈተና - የእንግሊዝኛ መማሪያ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>የእንግሊዝኛ ፈተና</h1>
<p>ዕውቀትዎን ይፈትኑ</p>
</header>
​<main class="container">
<!-- Question Box -->
<div id="quiz-container" class="card">
<h2 id="question">ጥያቄዎች በመጫን ላይ...</h2>
<div id="options-container"></div>
</div>
​<!-- Result Box -->
<div id="result-container" class="card" style="display: none; text-align: center;">
<h2>ፈተናውን ጨርሰዋል! 🎉</h2>
<p id="final-score" style="font-size: 1.1rem; margin: 15px 0; font-weight: 600;"></p>
<div id="best-score-display" class="score-badge"></div>
<button class="btn primary-btn" onclick="restartQuiz()" style="margin-top: 20px;">እንደገና ጀምር</button>
</div>
​<a href="index.html" class="back-link">← ወደ ዋና ገጽ ተመለስ</a>
</main>
​<script src="script.js"></script>
</body>
</html>
