<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የእኔ መለያ - የእንግሊዝኛ መማሪያ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ተጠቃሚ መለያ (Profile)</h1>
    </header>

    <main class="container">
        <div class="card">
            <h2>የግል መረጃ</h2>
            <div id="profile-display">
                <p><strong>ስም:</strong> <span id="user-name-display">አልተመዘገበም</span></p>
                <p><strong>ከፍተኛ ነጥብ:</strong> <span id="user-score-display">0</span></p>
            </div>
            
            <hr style="margin: 15px 0;">

            <h3>መረጃ ለማስተካከል</h3>
            <input type="text" id="name-input" placeholder="ስምዎን ያስገቡ..." style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
            <button id="save-profile-btn" class="btn primary-btn">ስም አስቀምጥ</button>
        </div>

        <a href="index.html" class="back-link">← ወደ ዋና ገጽ ተመለስ</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
